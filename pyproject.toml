[project]
name = "sleepiq"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi", "uvicorn", "sqlalchemy", "alembic", "httpx2"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "pip-audit", "detect-secrets"]

[tool.pytest.ini_options]
pythonpath = ["backend", "scripts"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
strict = true
files = ["backend/app"]
